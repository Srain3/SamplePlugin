plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.github.srain3' // ここは所有しているアドレス、あるいはGithubの名前を「com.github."名前"」でリンクの逆順で使用する。要は他と衝突しなければ良い。
version = '1.0.0-SNAPSHOT' // プラグインのバージョン

repositories {
    mavenCentral()
    // PaperのAPIを使う場合用
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
    // SpigotのAPIを使う場合用
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
    //implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21' //←これはshadowJarで含まれるライブラリ依存宣言
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21' //←これはshadowJarで含まない(コンパイルするときは参照する)ライブラリ依存宣言

    // PaperAPIを使う場合↓有効化(PaperAPIを使う場合、"SpigotAPI"はコメントアウトしてください)
    //compileOnly "io.papermc.paper:paper-api:26.3-R0.1-SNAPSHOT"

    // SpigotAPIを使う場合↓有効化(SpigotAPIを使う場合、"PaperAPI"はコメントアウトしてください)
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
}

kotlin {
    // ここでJavaバージョンを指定中
    compileJava {
        options.release.set(25)
    }
}

apply plugin: 'com.gradleup.shadow'

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}
