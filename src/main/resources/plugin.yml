name: Sample # Plugin名
description: "Kotlin製 SamplePlugin" # 説明
authors: # このリストに制作に関わった人をいれる
  - Srain3
website: "https://github.com/Srain3/SamplePlugin" # なるべくgithubのソースリンクを貼る
main: com.github.srain3.sample.Main
version: "1.0.0-SNAPSHOT" # ココのバージョンとbuild.gradleは一致させたほうが基本良い(マイクラ内部に使われる)
api-version: "1.21.11"

# 依存プラグイン
depend:
  - "Kotlin" # https://github.com/Srain3/Kotlin にて配布しているKotlinライブラリに依存します

# ↓この中に実装するコマンドを登録するための必要情報を書く
#commands:

# ↓この中に実装したいパーミッションを認識しやすくするための登録情報を書く
#permissions:
